<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHRONO.GRID — Interval Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#00ffcc">

<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-theme="green">

  <!-- Scanline overlay -->
  <div class="scanlines"></div>
  <!-- Particle canvas -->
  <canvas id="particleCanvas"></canvas>

  <div class="app-wrapper">

    <!-- Header -->
    <header class="site-header">
      <div class="logo-block">
        <span class="logo-prefix">◈</span>
        <h1 class="logo-text">CHRONO<span class="logo-accent">.GRID</span></h1>
        <span class="logo-suffix">◈</span>
      </div>
      <p class="tagline">INTERVAL CHECKLIST SYSTEM // v2.4.1</p>

    </header>

    <!-- Input Panel -->
    <section class="panel input-panel" id="inputPanel">
      <div class="panel-header">
        <span class="panel-tag">01</span>
        <h2 class="panel-title">MISSION PARAMETERS</h2>
        <div class="panel-line"></div>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label class="input-label" for="startDate">
            <span class="label-icon">◷</span> START DATE
          </label>
          <input type="date" id="startDate" class="sci-input" />
        </div>

        <div class="input-group">
          <label class="input-label" for="intervalDays">
            <span class="label-icon">⌥</span> INTERVAL (DAYS)
          </label>
          <input type="number" id="intervalDays" class="sci-input" min="1" value="7" placeholder="7" />
        </div>

        <div class="input-group">
          <label class="input-label" for="totalIntervals">
            <span class="label-icon">⊞</span> TOTAL CHECKPOINTS
          </label>
          <input type="number" id="totalIntervals" class="sci-input" min="1" value="10" placeholder="10" />
        </div>
      </div>

      <div class="button-row">
        <button class="sci-btn primary" id="generateBtn">
          <span class="btn-icon">⚡</span>
          INITIALIZE GRID
        </button>
        <button class="sci-btn secondary" id="resetBtn">
          <span class="btn-icon">↺</span>
          RESET
        </button>
      </div>
    </section>

    <!-- Progress Panel -->
    <section class="panel progress-panel" id="progressPanel" style="display:none">
      <div class="panel-header">
        <span class="panel-tag">02</span>
        <h2 class="panel-title">MISSION STATUS</h2>
        <div class="panel-line"></div>
      </div>

      <div class="progress-stats">
        <div class="stat-block">
          <span class="stat-num" id="completedCount">0</span>
          <span class="stat-label">COMPLETED</span>
        </div>
        <div class="stat-divider">/</div>
        <div class="stat-block">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">TOTAL</span>
        </div>
        <div class="stat-percent-block">
          <span class="stat-percent" id="percentDisplay">0%</span>
        </div>
      </div>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
        <div class="progress-bar-glow" id="progressGlow"></div>
      </div>

      <div class="progress-label-row">
        <span class="progress-label-text" id="progressStatus">AWAITING MISSION LAUNCH</span>
        <button class="sci-btn export-btn" id="exportBtn">
          <span class="btn-icon">⬇</span> EXPORT
        </button>
      </div>

      <!-- Export submenu -->
      <div class="export-menu" id="exportMenu" style="display:none">
        <button class="export-option" id="exportPDF">
          <span>◧</span> Export as PDF
        </button>
        <button class="export-option" id="exportImage">
          <span>◨</span> Export as Image
        </button>
      </div>
    </section>

    <!-- Checklist Panel -->
    <section class="panel checklist-panel" id="checklistPanel" style="display:none">
      <div class="panel-header">
        <span class="panel-tag">03</span>
        <h2 class="panel-title">CHECKPOINT LOG</h2>
        <div class="panel-line"></div>
      </div>

      <div class="checklist-container" id="checklistContainer">
        <!-- Items injected by JS -->
      </div>
    </section>

    <footer class="site-footer">
      <span>◈ CHRONO.GRID SYSTEM — AUTOSAVE ACTIVE ◈</span>

      <div class="social-links">
        <a href="https://x.com/unfollowaman" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.847h-7.406l-5.8-7.584-6.639 7.584H.474l8.6-9.83L0 1.153h7.594l5.243 6.932z"/>
          </svg>
          <span>X / Twitter</span>
        </a>

        <a href="https://www.instagram.com/unfollowaman_?igsh=MWNieGYzdDU3a3praQ==" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.75 2C4.574 2 2 4.574 2 7.75v8.5C2 19.426 4.574 22 7.75 22h8.5C19.426 22 22 19.426 22 16.25v-8.5C22 4.574 19.426 2 16.25 2zm0 2h8.5A3.75 3.75 0 0 1 20 7.75v8.5A3.75 3.75 0 0 1 16.25 20h-8.5A3.75 3.75 0 0 1 4 16.25v-8.5A3.75 3.75 0 0 1 7.75 4m9.5 1a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6"/>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </footer>
  </div>

  <!-- jsPDF + html-to-image via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
